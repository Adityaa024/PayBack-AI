# PayBack-AI Differentiator: Versioned Merchant-Specific Policy Controls
# These settings override system defaults and act as hard guardrails before AI executes.

version: "1.0.0"

# Default generic merchant profile
default_merchant:
  amount_floor: 100.0                   # Minimum recoverable amount in INR (Economic Floor)
  holdout_ratio: 0.20                  # 20% Hash-Based Holdout Control Arm
  intervention_caps:
    max_contacts_per_invoice: 3
    max_daily_contacts_per_customer: 1
    max_total_spend_per_batch: 5000.0   # ₹ limit circuit breaker
  retry_schedule:
    max_attempts: 3
    cooldown_hours: 24
    retry_intervals_days: [1, 3, 7]
  compliance:
    quiet_hours_start: "21:00"          # Cannot contact after 9 PM in customer timezone
    quiet_hours_end: "08:00"            # Cannot contact before 8 AM in customer timezone
    customer_timezone: "Asia/Kolkata"
    require_human_approval_above: 500000.0 # High-Value Guard: ₹5,00,000+
    allowed_channels: ["email", "sms", "whatsapp"]
  allowed_incident_lanes:
    - "payment_degradation"
    - "subscription_rescue"
    - "checkout_dropoff"
    - "b2b_receivables"

# Enterprise merchant with relaxed limits
enterprise_tenant_1:
  amount_floor: 250.0
  holdout_ratio: 0.20
  intervention_caps:
    max_contacts_per_invoice: 5
    max_daily_contacts_per_customer: 2
    max_total_spend_per_batch: 50000.0
  retry_schedule:
    max_attempts: 5
    cooldown_hours: 12
    retry_intervals_days: [1, 2, 4, 7]
  compliance:
    quiet_hours_start: "20:00"
    quiet_hours_end: "09:00"
    customer_timezone: "Asia/Kolkata"
    require_human_approval_above: 250000.0
    allowed_channels: ["email", "sms", "voice", "whatsapp"]
  allowed_incident_lanes:
    - "payment_degradation"
    - "subscription_rescue"
    - "checkout_dropoff"
    - "b2b_receivables"

# Strict compliance merchant (e.g. Healthcare billing)
strict_health_tenant:
  amount_floor: 500.0
  holdout_ratio: 0.20
  intervention_caps:
    max_contacts_per_invoice: 2
    max_daily_contacts_per_customer: 1
    max_total_spend_per_batch: 2000.0
  retry_schedule:
    max_attempts: 2
    cooldown_hours: 48
    retry_intervals_days: [2, 7]
  compliance:
    quiet_hours_start: "18:00"
    quiet_hours_end: "10:00"
    customer_timezone: "Asia/Kolkata"
    require_human_approval_above: 10000.0
    allowed_channels: ["email"]         # No SMS/Voice allowed for healthcare billing
  allowed_incident_lanes:
    - "payment_degradation"
    - "b2b_receivables"
